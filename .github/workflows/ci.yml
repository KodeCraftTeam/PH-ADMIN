name: CI

on:
  push:
    branches: [develop, main]
    paths: ['back/**']
  pull_request:
    branches: [develop, main]
    paths: ['back/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: back/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Generate DBML from database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx dbdocs db2dbml postgres "$DATABASE_URL" -o database.dbml
      - name: Update dbdocs project
        env:
          DBDOCS_TOKEN: ${{ secrets.DBDOCS_TOKEN }}
        run: npx dbdocs build database.dbml --project PH-ADMIN

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true